name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      engine_revision:
        description: 'Compatible Hooky-engine commit (full 40-character SHA)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js App
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test studio path resolution
        run: npm run test:tooling

  browser:
    # A paired revision must include the Studio repairs; an unrelated default branch is not a valid fixture host.
    if: ${{ inputs.engine_revision != '' || vars.HOOKY_ENGINE_REVISION != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENGINE_REVISION: ${{ inputs.engine_revision || vars.HOOKY_ENGINE_REVISION }}
    steps:
      - name: Validate paired revision
        run: '[[ "$ENGINE_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          path: Hooky-website
      - uses: actions/checkout@v4
        with:
          repository: pranav256/Hooky-engine
          ref: ${{ env.ENGINE_REVISION }}
          path: Hooky-engine
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Hooky-website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated browser hosts
        run: |
          python -m pip install uv
          cd Hooky-engine
          uv sync --locked --extra all --extra dev
          cd ../Hooky-website
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Browser matrix (390, 768, 1440, 1728)
        working-directory: Hooky-website
        run: npm run check:browser-ci
      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-failure
          path: Hooky-website/.design-review/
